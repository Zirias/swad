<html>
  <head>
    <title>%%REALM%% Login</title>
    <link rel="stylesheet" type="text/css" href="%%SELF%%/static/style.css">
<style type="text/css">
.spinner {
  display: none;
  border: 4px solid DodgerBlue;
  border-top: 4px solid Black;
  border-radius: 50%;
  margin: auto;
  width: 2em;
  height: 2em;
  animation: spin 2s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
<script type="module" src="%%SELF%%/static/pow.mjs"></script>
  </head>
  <body>
    <h1>%%REALM%% Login</h1>
    <div class="spinner"></div>
    <p class="error">
      <noscript>Javascript disabled or not supported.</noscript>
    </p>
    <form action="%%SELF%%" method="post" autocomplete="off"
	  data-challenge="%%CHALLENGE%%" data-difficulty="%%DIFFICULTY%%">
      <input type="hidden" name="%%CSRFNAME%%" value="%%CSRFTOKEN%%">
      <input type="hidden" name="user" value="%%USER%%">
      <input type="hidden" name="pw">
      <input type="hidden" name="login" value="login">
    </form>
  </body>
</html>
